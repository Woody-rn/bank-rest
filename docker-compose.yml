services:
  postgres:
    image: postgres:18-alpine
    container_name: bank_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bank_card}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-bank_card}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bank_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bank_card}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-qV3nL9pR2sT7wX1yZ5aB8cD0eF3gH6jK}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY:-9fMovLiS2BDudjdOQ39LMotcTBQyLJ1UYwiDe53Glsa}
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - bank_network

volumes:
  postgres_data:
    name: bank_card

networks:
  bank_network:
    driver: bridge